name: Validate and package
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Every main push must finish: rapid merges must not cancel another release.
# PR updates may still cancel superseded validation runs.
concurrency:
  group: validate-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  unit:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
  browser:
    # Keep the browser runner on an OS supported by the pinned Playwright.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run browser tests with a desktop window manager
        run: |
          sudo apt-get install -y openbox
          xvfb-run --auto-servernum sh -c 'openbox >/tmp/fvt-openbox.log 2>&1 & exec npm run test:browser'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
  package:
    needs: [unit, browser]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build reproducible browser package
        env:
          RELEASE_RUN: ${{ github.run_number }}
          SOURCE_SHA: ${{ github.sha }}
        run: python3 scripts/package.py --release-run "$RELEASE_RUN" --sha "$SOURCE_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: floating-video-toolkit
          path: dist/*
          retention-days: 30
          if-no-files-found: error
  release:
    # PR, dev, tag, and manual runs must never publish a release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: floating-video-toolkit
          path: dist
      - name: Publish the tested archive for this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py
